services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    # API only on the Compose network (browser reaches it via the frontend Vite proxy).
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/review_assistant.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_HOST: http://host.docker.internal:11434
      CORS_ORIGINS: http://127.0.0.1:${HOST_WEB_PORT:-7847},http://localhost:${HOST_WEB_PORT:-7847}
    volumes:
      - ./data:/app/data
      - docling_models:/app/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    ports:
      - "127.0.0.1:${HOST_WEB_PORT:-7847}:${VITE_DEV_PORT:-7847}"
    environment:
      VITE_DEV_PORT: ${VITE_DEV_PORT:-7847}
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  docling_models:
