name: vantage-dev

services:
  backend:
    container_name: vantage-backend-dev
    image: ${IMAGE_REGISTRY:-}vantage-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      platforms:
        - linux/arm64
        - linux/amd64
      args:
        # Empty → backend uses pyproject version; set IMAGE_TAG to override (e.g. 0.2.1).
        APP_VERSION: ${IMAGE_TAG:-}
        GIT_SHA: ${GIT_SHA:-}
      labels:
        org.opencontainers.image.title: "Vantage Backend"
        org.opencontainers.image.description: "FastAPI backend & Docling document processing for Vantage"
        org.opencontainers.image.vendor: "Fontys ICT"
        org.opencontainers.image.version: "${IMAGE_TAG:-}"
        org.opencontainers.image.revision: "${GIT_SHA:-}"
        org.opencontainers.image.source: "${OCI_IMAGE_SOURCE:-https://github.com/jpligthart/vantage}"
        org.opencontainers.image.licenses: "MIT"
    # API only on the Compose network (browser reaches it via the frontend proxy).
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/vantage.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_HOST: http://host.docker.internal:11434
      CORS_ORIGINS: http://127.0.0.1:${HOST_WEB_PORT:-7847},http://localhost:${HOST_WEB_PORT:-7847}
      APP_VERSION: ${IMAGE_TAG:-}
      GIT_SHA: ${GIT_SHA:-}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    container_name: vantage-frontend-dev
    image: ${IMAGE_REGISTRY:-}vantage-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: ${FRONTEND_TARGET:-prod}
      platforms:
        - linux/arm64
        - linux/amd64
      args:
        # Empty → Vite reads frontend/package.json; set IMAGE_TAG to override.
        APP_VERSION: ${IMAGE_TAG:-}
        GIT_SHA: ${GIT_SHA:-}
      labels:
        org.opencontainers.image.title: "Vantage Frontend"
        org.opencontainers.image.description: "React web UI (Nginx) for Vantage"
        org.opencontainers.image.vendor: "Fontys ICT"
        org.opencontainers.image.version: "${IMAGE_TAG:-}"
        org.opencontainers.image.revision: "${GIT_SHA:-}"
        org.opencontainers.image.source: "${OCI_IMAGE_SOURCE:-https://github.com/jpligthart/vantage}"
        org.opencontainers.image.licenses: "MIT"
    ports:
      - "127.0.0.1:${HOST_WEB_PORT:-7847}:${FRONTEND_INTERNAL_PORT:-80}"
    environment:
      VITE_DEV_PORT: ${VITE_DEV_PORT:-7847}
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
