name: vantage

services:
  backend:
    container_name: vantage-backend
    image: ${IMAGE_REGISTRY:-}vantage-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/vantage.db
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${HOST_WEB_PORT:-7847}}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    container_name: vantage-frontend
    image: ${IMAGE_REGISTRY:-}vantage-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "${HOST_WEB_PORT:-7847}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
